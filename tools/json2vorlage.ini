; Einstellungen fuer json2vorlage.py
; Aufruf:  python json2vorlage.py anlage.json
; Relative Pfade werden zuerst im aktuellen Ordner gesucht, sonst neben dieser Datei.
; Ja/Nein-Werte: ja / nein

[vorlage]
; Ueberschrift im Blatt und in der Druck-Kopfzeile
titel = Variablenbericht

; Name der erzeugten Vorlage
ausgabe = Vorlage_Variablen.xlsx

; Vom Excel-Add-in angelegte Mappe mit einem Einzelwert-Segment und leerem Blatt.
; Leer = basis_vorlage.xlsx neben dem Skript, sonst test.xlsx im aktuellen Ordner.
basis =

; Qualitaetscode rechts neben jedem Wert: GOOD (192) / UNCERTAIN (76) / BAD (24)
qualitaet = ja

; Zeile "Erstellt am:" mit dem Zeitpunkt der Berichtserzeugung
erstellt_am = ja

; Nach Variablentabellen gruppieren: je Tabelle eine graue Ueberschriftzeile.
; Reihenfolge wie unter [filter] tabellen, sonst alphabetisch.
gruppieren = ja

[filter]
; TIA-Export der HMI-Variablen (HMITags.xlsx). Leer = kein Tabellenfilter.
variablen_excel =

; Nur diese Variablentabellen (Komma oder eine pro Zeile, Platzhalter wie SPS_* erlaubt).
; Leer = alle Tabellen. Die Zuordnung kommt aus variablen_excel oder aus der Verwendung.
tabellen =

; Nur Variablen, die im HMI verwendet werden (Bilder, Alarme, Archiv, Skripte).
; Braucht den laufenden TIA-MCP-Server mit geoeffnetem Projekt.
nur_verwendete = nein

; Spalte "Verwendet in" mit den Fundstellen im HMI (braucht ebenfalls den MCP-Server)
spalte_verwendet = nein

; Ergebnis der Verwendungs-Abfrage. Vorhanden -> wird gelesen (kein TIA noetig, z.B. an der
; Anlage); fehlt die Datei -> live vom MCP-Server abfragen und hier speichern.
; Leer = immer live abfragen.
verwendung_datei =

; ---- selten gebraucht ----
; Systemvariablen (@Heartbeat, @CurrentLanguage ...) mit aufnehmen
system_tags = nein
; Regulaerer Ausdruck auf den Variablennamen, z.B. ^Motor
name_filter =
