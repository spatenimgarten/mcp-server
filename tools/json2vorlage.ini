; Einstellungen fuer json2vorlage.py
; Aufruf:  python json2vorlage.py              (Variablen aus dem TIA-Projekt ueber den MCP-Server)
;          python json2vorlage.py anlage.json  (Variablen aus der Offline-Konfiguration)
; Relative Pfade werden zuerst im aktuellen Ordner gesucht, sonst neben dieser Datei.
; Ja/Nein-Werte: ja / nein

[vorlage]
; HMI(s), fuer die Vorlagen erzeugt werden (Komma). Leer = alle Unified-HMIs im Projekt
; (oder die HMI aus der JSON, wenn eine angegeben ist). {hmi} in ausgabe, titel und
; verwendung_datei wird durch den Namen ersetzt, z.B. ausgabe = Vorlage_{hmi}.xlsx
hmi =

; Ueberschrift im Blatt und in der Druck-Kopfzeile
titel = Variablenbericht

; Name der erzeugten Vorlage
ausgabe = Vorlage_Variablen.xlsx

; Vom Excel-Add-in angelegte Mappe mit einem Einzelwert-Segment und leerem Blatt.
; Leer = basis_vorlage.xlsx neben dem Skript, sonst test.xlsx im aktuellen Ordner.
basis =

; Qualitaetscode rechts neben jedem Wert: GOOD (192) / UNCERTAIN (76) / BAD (24)
qualitaet = ja

; Zeile "Erstellt am:" mit dem Zeitpunkt der Berichtserzeugung
erstellt_am = ja

; Nach Variablentabellen gruppieren: je Tabelle eine graue Ueberschriftzeile.
; Reihenfolge wie unter [filter] tabellen, sonst alphabetisch.
gruppieren = ja

[filter]
; Tabellen, Datentypen und Verwendung kommen aus dem TIA-Projekt: live ueber den TIA-MCP-Server
; (Projekt in TIA offen) oder aus verwendung_datei. Gebraucht fuer tabellen, datentypen,
; nur_verwendete, spalte_verwendet und gruppieren.

; Nur diese Namen (Komma oder eine pro Zeile), gilt auch fuer UDT-Elemente:
;   Drehzahl      Name enthaelt "Drehzahl" (z.B. Motor1.Drehzahl, Motor2.Drehzahl)
;   Motor1.*      Muster mit * oder ? fuer den ganzen Namen
;   !*Sollwert    mit ! davor ausschliessen
; Gross-/Kleinschreibung egal. Leer = alle Namen.
namen =

; Nur Variablen dieser Datentypen, z.B. UDT_Motor, UDT_Ventil* (Schreibweise wie bei namen).
; Gilt fuer den Typ der Variable selbst; ihre UDT-Elemente werden einzeln ausgegeben.
datentypen =

; Nur diese Variablentabellen (Komma oder eine pro Zeile, Platzhalter wie SPS_* erlaubt,
; ! davor = ausschliessen). Genauer Tabellenname oder Muster, kein "enthaelt".
; Leer = alle Tabellen.
tabellen =

; Wie namen, datentypen und tabellen zusammenwirken:
;   und  = alle eingetragenen Filter muessen passen (Standard)
;   oder = einer reicht, z.B. alle UDT_Motor PLUS alles aus Tabelle Sollwerte PLUS Namen mit ProjektNr
; Ausschluesse mit ! gelten immer. Leere Filter zaehlen nicht.
verknuepfung = und

; Nur Variablen, die im HMI verwendet werden (Bilder, Alarme, Archiv, Skripte).
; Braucht den laufenden TIA-MCP-Server mit geoeffnetem Projekt.
nur_verwendete = nein

; Spalte "Verwendet in" mit den Fundstellen im HMI (braucht ebenfalls den MCP-Server)
spalte_verwendet = nein

; Ergebnis der Abfrage aus dem TIA-Projekt (Variablen, Typen, Tabellen, Verwendung).
; Vorhanden -> wird gelesen (kein TIA noetig, z.B. an der Anlage); fehlt die Datei -> live vom
; MCP-Server abfragen und hier speichern. Bei mehreren HMIs mit {hmi}, z.B. verwendung_{hmi}.json
; Leer = immer live abfragen.
verwendung_datei =

; Globale Skriptmodule bei der Verwendung mit auswerten (Export + Textsuche). Bei sehr grossen
; Projekten oder wenn die Abfrage haengt: nein (Bilder, Alarme und Archiv werden weiter ausgewertet).
skripte_auswerten = ja

; ---- selten gebraucht ----
; Systemvariablen (@Heartbeat, @CurrentLanguage ...) mit aufnehmen
system_tags = nein

[runtime]
; Unified laedt von Strukturvariablen (UDTs) nur die Elemente, die im HMI verwendet werden
; (spart PowerTags). Alle anderen kann der Bericht nicht lesen und bricht mit "Uncaught exception" ab.
; pruefen = ja: die laufende Runtime fragen und solche Elemente aus der Vorlage nehmen.
; Benutzer/Passwort eines Runtime-Benutzers werden abgefragt (Passwort verdeckt, nie gespeichert).
pruefen = nein

; GraphQL-Adresse der Runtime
url = http://localhost:4000/graphql

; Runtime-Benutzer (leer = beim Start fragen)
benutzer =

; Ergebnis der letzten Pruefung (nicht geladene Elemente). Laeuft die Runtime nicht, wird diese
; Datei genommen. {hmi} = Name des HMI.
datei = runtime_{hmi}.txt

[server]
; Laeuft der TIA-MCP-Server nicht (keine Claude-Sitzung), startet das Skript ihn selbst im
; Hintergrund und beendet ihn am Ende wieder (gibt TIA damit sofort frei).
autostart = ja
mcp_server = C:\tia-mcp\mcp-server
